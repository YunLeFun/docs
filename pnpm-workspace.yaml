shellEmulator: true

# eslint-disable-next-line pnpm/yaml-enforce-settings
trustPolicy: off

packages:
  - docs

overrides:
  # Keep documentation and lint tooling on versions with published security fixes.
  esbuild@>=0.27.3 <0.28.1: ^0.28.1
  # Upstream math and glob parsers still constrain these vulnerable release lines.
  katex@>=0.11.0 <0.18.2: ^0.18.2
  markdown-it@>=14.0.0 <14.3.3: ^14.3.3
  minimatch@>=10.0.0 <11.0.1: ^11.0.1
  rollup@>=4.0.0 <4.59.0: ^4.59.0
  vite@>=8.3.0 <8.3.3: ^8.3.5
  vitest@>=4.0.0 <4.1.11: ^4.1.11

catalog:
  '@antfu/eslint-config': ^8.3.0
  '@iconify-json/svg-spinners': ^1.2.4
  '@shikijs/vitepress-twoslash': ^3.23.0
  '@types/node': ^25.9.9
  '@unocss/reset': ^66.10.5
  '@vueuse/core': ^14.4.0
  '@yunyoujun/docs': ^0.1.14
  eslint: ^10.12.0
  floating-vue: ^5.4.0
  lint-staged: ^17.6.0
  pinia: ^3.0.4
  pnpm: ^10.34.6
  simple-git-hooks: ^2.14.0
  typescript: ^5.9.3
  unocss: ^66.10.5
  unplugin-vue-components: ^32.1.0
  vite: ^8.3.5
  vite-plugin-vue-devtools: ^8.2.1
  vite-tsconfig-paths: ^6.1.1
  vitepress: 2.0.0-alpha.20
  vitepress-plugin-group-icons: ^1.7.6
  vitepress-theme-yunlefun: https://github.com/YunLeFun/design/releases/download/theme-v0.3.0/vitepress-theme-yunlefun-0.3.0.tgz
  vue: ^3.5.43
